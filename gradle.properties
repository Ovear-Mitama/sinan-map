# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 必须用 JDK 25 运行 Gradle（Loom 1.18.2 与 NeoForge 26.1 的硬性要求）：
# 设置 JAVA_HOME 指向 JDK 25，或在 IDE 中把 Gradle JVM 选为 JDK 25

# Mod Properties
version=1.0.0
group=sinanmap

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2

# 开发环境专用（modLocalRuntime），对应 Minecraft 26.1
modmenu_version=18.0.2

# 可选兼容：传送石碑（Waystones）及它依赖的 Balm / Shogi，只编译期引用 + 开发环境本地运行
# 查最新版本：https://modrinth.com/mod/waystones/versions
#            https://modrinth.com/mod/balm/versions
#            https://modrinth.com/mod/shogi/versions
waystones_version=26.1.2.16+fabric-26.1.2
balm_version=26.1.2.15+fabric-26.1.2
shogi_version=26.1.2.12+fabric-26.1.2

# Test
junit_version=5.14.4
