plugins {
	id 'net.neoforged.moddev' version '2.0.146'
}

// 版本写在 gradle.properties，便于对照 https://projects.neoforged.net/neoforged/neoforge 更新
def neoforgeVersion = project.neoforge_version
def junitVersion = project.junit_version

repositories {
	mavenCentral()
}

// 核心库（源码在 ../lib/）：编译用它，打包时也把它的类并进模组 jar
configurations {
	coreLib
}

dependencies {
	implementation 'sinanmap:sinan-lib:0.1.0'
	coreLib 'sinanmap:sinan-lib:0.1.0'
	testImplementation platform("org.junit:junit-bom:${junitVersion}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
	// 26.1.x 已转正为稳定版本，固定精确版本号以保证可复现
	version = neoforgeVersion

	// 校验 access transformer 目标，写错时直接报错
	validateAccessTransformers = true

	runs {
		client {
			client()
		}
	}

	mods {
		sinanmap {
			sourceSet sourceSets.main
		}
	}
}

// 纯逻辑在 ../lib/；这里只留依赖 Minecraft 的网络协议（两个加载器共用）
sourceSets {
	main {
		java.srcDir '../shared/java'
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.test {
	useJUnitPlatform()
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': modVersion
	}
}

// 把 Sinan Lib 的类解出来，随模组 jar 一起发布
def coreLibFiles = configurations.coreLib.incoming.artifactView { }.files
def unpackCoreLib = tasks.register('unpackCoreLib', Sync) {
	from coreLibFiles.collect { zipTree(it) }
	into layout.buildDirectory.dir('core-lib')
	exclude 'META-INF/MANIFEST.MF'
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	dependsOn gradle.includedBuild('lib').task(':jar')
}

jar {
	from unpackCoreLib
	// rename 闭包在执行期运行，路径与名字要在配置期取好，否则配置缓存会报错
	def repoRoot = rootDir.parentFile
	def jarNameSuffix = project.name
	from(new File(repoRoot, 'LICENSE')) {
		rename { "${it}_${jarNameSuffix}" }
	}
	// 产物命名：mod名称-mod版本号-加载器-MC版本（如 sinanmap-26.1.0.1-neoforge-26.1.2.jar）
	archiveFileName = "sinanmap-${project.version}-neoforge-${project.minecraft_version}.jar"
}
