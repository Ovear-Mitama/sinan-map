# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 必须用 JDK 25 运行 Gradle（Loom 1.18.2 与 NeoForge 26.1 的硬性要求）：
# 设置 JAVA_HOME 指向 JDK 25，或在 IDE 中把 Gradle JVM 选为 JDK 25

# Mod Properties
# mod 版本号（与 MC 版本解耦，按"26.1.0.1"这种格式递增）
version=26.1.0.1
group=sinanmap

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.109
# 仅供构建产物命名使用（加载器版本号里已含 MC 版本，这里单独写一份便于命名规则统一）
minecraft_version=26.1.2

# Test
junit_version=5.14.4
